<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Librería Nexus — Recién Llegados</title>
<link rel="icon" type="image/png" href="../img/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<link href="https://fonts.googleapis.com" rel="preconnect"><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,200..900;1,7..72,200..900&amp;family=Manrope:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="js/tailwind-config.js"></script>
<link href="css/empleados.css" rel="stylesheet">
</head>
<body class="bg-background font-body-md text-on-surface antialiased" data-page="recientes">
<main class="w-full">
<div class="px-space-xl py-space-xl max-w-[1440px] mx-auto w-full flex flex-col gap-space-lg">
  <div class="flex flex-col gap-space-xs max-w-2xl">
    <div class="flex items-center gap-space-xs text-secondary font-label-sm text-label-sm uppercase tracking-wider"><span class="material-symbols-outlined text-[16px]">auto_awesome</span><span>Vitrina de Novedades</span></div>
    <h1 class="font-headline-lg text-headline-lg text-primary tracking-tight">Recién Llegados</h1>
    <p class="font-body-md text-body-md text-on-surface-variant">Libros marcados con <code>reciente: true</code>. Al cambiar a <code>false</code>, dejarán de aparecer como novedades en la página pública.</p>
  </div>

  <div class="rounded-xl bg-surface-container-lowest shadow-sm overflow-hidden">
    <table class="w-full text-left">
      <thead>
        <tr class="bg-surface-container-low text-outline font-label-sm text-label-sm uppercase tracking-wider">
          <th class="py-space-md px-space-md">ID</th>
          <th class="py-space-md px-space-sm">Portada</th>
          <th class="py-space-md px-space-md">Título</th>
          <th class="py-space-md px-space-md">Autor</th>
          <th class="py-space-md px-space-md">Categoría</th>
          <th class="py-space-md px-space-md text-right">Acciones</th>
        </tr>
      </thead>
      <tbody id="recientes-tbody"></tbody>
    </table>
  </div>
</div>
</main>

<script src="js/auth.js"></script>
<script src="js/empleados.js"></script>
<script src="js/chrome.js"></script>
<script src="js/libros.js"></script>
</body>
</html>
