<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Librería Nexus — Agregar / Editar Libro</title>
<link rel="icon" type="image/png" href="../img/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<link href="https://fonts.googleapis.com" rel="preconnect"><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,200..900;1,7..72,200..900&amp;family=Manrope:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="js/tailwind-config.js"></script>
<link href="css/empleados.css" rel="stylesheet">
</head>
<body class="bg-background font-body-md text-on-surface antialiased" data-page="agregar">
<main class="w-full">
<div class="w-full max-w-7xl mx-auto px-space-md sm:px-space-xl py-space-xl flex flex-col gap-space-xl">

  <div class="flex flex-col gap-space-xs pb-space-lg border-b border-outline-variant/30">
    <nav class="flex items-center gap-space-xs font-label-md text-label-md text-on-surface-variant">
      <a class="hover:text-secondary transition-colors" href="libros.html">Libros</a>
      <span class="material-symbols-outlined text-[14px]">chevron_right</span>
      <span>Ficha de catálogo</span>
    </nav>
    <h1 class="font-headline-lg text-headline-lg text-primary tracking-tight" id="form-title">Agregar nuevo libro</h1>
    <p class="font-body-md text-body-md text-on-surface-variant" id="form-subtitle">Registra un nuevo título en la base de datos de sala.</p>
  </div>

  <form id="book-form" class="grid grid-cols-1 lg:grid-cols-12 gap-space-xl items-start">
    <div class="lg:col-span-8 flex flex-col gap-space-xl">

      <section class="bg-surface-container-lowest rounded-xl p-space-xl shadow-sm flex flex-col gap-space-lg">
        <h2 class="font-title-lg text-title-lg text-primary">Información básica</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-space-lg">
          <div class="flex flex-col gap-1 md:col-span-2">
            <label class="font-label-md text-label-md text-on-surface" for="f-titulo">Título <span class="text-error">*</span></label>
            <input class="w-full px-space-md py-3 bg-surface-container-low rounded-lg focus:outline-none focus:ring-2 focus:ring-secondary/40" id="f-titulo" required type="text">
          </div>
          <div class="flex flex-col gap-1">
            <label class="font-label-md text-label-md text-on-surface" for="f-autor">Autor <span class="text-error">*</span></label>
            <input class="w-full px-space-md py-2.5 bg-surface-container-low rounded-lg focus:outline-none focus:ring-2 focus:ring-secondary/40" id="f-autor" required type="text">
          </div>
          <div class="flex flex-col gap-1">
            <label class="font-label-md text-label-md text-on-surface" for="f-categoria">Categoría <span class="text-error">*</span></label>
            <select class="w-full px-space-md py-2.5 bg-surface-container-low rounded-lg focus:outline-none focus:ring-2 focus:ring-secondary/40 cursor-pointer" id="f-categoria" required></select>
          </div>
          <div class="flex flex-col gap-1">
            <label class="font-label-md text-label-md text-on-surface" for="f-editorial">Editorial</label>
            <input class="w-full px-space-md py-2.5 bg-surface-container-low rounded-lg focus:outline-none focus:ring-2 focus:ring-secondary/40" id="f-editorial" type="text">
          </div>
          <div class="grid grid-cols-2 gap-space-sm">
            <div class="flex flex-col gap-1">
              <label class="font-label-md text-label-md text-on-surface" for="f-anio">Año</label>
              <input class="w-full px-space-md py-2.5 bg-surface-container-low rounded-lg focus:outline-none focus:ring-2 focus:ring-secondary/40" id="f-anio" type="number">
            </div>
            <div class="flex flex-col gap-1">
              <label class="font-label-md text-label-md text-on-surface" for="f-idioma">Idioma</label>
              <input class="w-full px-space-md py-2.5 bg-surface-container-low rounded-lg focus:outline-none focus:ring-2 focus:ring-secondary/40" id="f-idioma" type="text" value="Español">
            </div>
          </div>
          <div class="flex flex-col gap-1 md:col-span-2 grid grid-cols-1 sm:grid-cols-2 gap-space-md">
            <div class="flex flex-col gap-1">
              <label class="font-label-md text-label-md text-on-surface" for="f-isbn">ISBN</label>
              <input class="w-full px-space-md py-2.5 bg-surface-container-low rounded-lg focus:outline-none focus:ring-2 focus:ring-secondary/40" id="f-isbn" type="text">
            </div>
            <div class="flex flex-col gap-1">
              <label class="font-label-md text-label-md text-on-surface" for="f-id-display">ID (automático)</label>
              <input class="w-full px-space-md py-2.5 bg-surface-container-high text-on-surface-variant rounded-lg" id="f-id-display" readonly type="text">
            </div>
          </div>
        </div>
      </section>

      <section class="bg-surface-container-lowest rounded-xl p-space-xl shadow-sm flex flex-col gap-space-md">
        <h2 class="font-title-lg text-title-lg text-primary">Descripción</h2>
        <textarea class="w-full p-space-md bg-surface-container-low/70 rounded-lg focus:outline-none focus:ring-2 focus:ring-secondary/40 resize-y" id="f-descripcion" rows="5"></textarea>
      </section>

      <section class="bg-surface-container-lowest rounded-xl p-space-xl shadow-sm flex flex-col gap-space-lg">
        <h2 class="font-title-lg text-title-lg text-primary">Existencias</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-space-lg">
          <div class="flex flex-col gap-1">
            <label class="font-label-md text-label-md text-on-surface" for="f-precio">Precio (€)</label>
            <input class="w-full px-space-md py-2.5 bg-surface-container-low rounded-lg focus:outline-none focus:ring-2 focus:ring-secondary/40" id="f-precio" step="0.01" type="number" min="0">
          </div>
          <div class="flex flex-col gap-1">
            <label class="font-label-md text-label-md text-on-surface" for="f-stock">Stock</label>
            <input class="w-full px-space-md py-2.5 bg-surface-container-low rounded-lg focus:outline-none focus:ring-2 focus:ring-secondary/40" id="f-stock" type="number" min="0">
          </div>
        </div>
        <label class="flex items-center justify-between p-space-md rounded-lg bg-surface-container-low/60 cursor-pointer">
          <div class="flex items-center gap-space-md">
            <span class="material-symbols-outlined text-secondary">auto_awesome</span>
            <div>
              <span class="font-title-md text-title-md text-on-surface font-semibold">Marcar como "Recién llegado"</span>
              <p class="font-body-sm text-body-sm text-on-surface-variant">Se destacará en la vitrina de novedades del sitio público.</p>
            </div>
          </div>
          <input class="h-5 w-5 accent-secondary cursor-pointer" id="f-reciente" type="checkbox">
        </label>
      </section>
    </div>

    <div class="lg:col-span-4 flex flex-col gap-space-xl lg:sticky lg:top-24">
      <div class="bg-surface-container-lowest rounded-xl p-space-lg shadow-sm flex flex-col gap-space-md">
        <h3 class="font-title-lg text-title-lg text-primary flex items-center gap-space-xs"><span class="material-symbols-outlined text-secondary text-[20px]">image</span>Portada</h3>
        <div class="w-48 aspect-[3/4] rounded-md overflow-hidden shadow-md mx-auto bg-surface-container">
          <img class="w-full h-full object-cover" id="preview-cover" src="../imagenes/placeholder.svg" alt="Portada">
        </div>
        <p class="font-body-sm text-body-sm text-outline text-center">La portada se asigna automáticamente: <code>imagenes/{categoria}/{id}.jpg</code></p>
      </div>

      <div class="bg-surface-container-low/70 rounded-xl p-space-lg flex flex-col gap-space-sm">
        <span class="font-label-sm text-label-sm text-on-surface-variant uppercase">Vista previa</span>
        <h4 class="font-headline-sm text-headline-sm text-primary" id="preview-title">Sin título</h4>
        <p class="font-body-sm text-body-sm text-on-surface-variant" id="preview-author"></p>
        <p class="font-label-sm text-label-sm text-secondary uppercase" id="preview-category"></p>
        <p class="font-headline-sm text-headline-sm text-primary" id="preview-price"></p>
        <p class="font-label-sm text-label-sm text-outline" id="preview-status"></p>
      </div>

      <div class="bg-surface-container-lowest rounded-xl p-space-lg shadow-sm flex flex-col gap-space-sm">
        <button class="w-full py-3.5 px-space-lg rounded-xl bg-secondary text-on-secondary font-title-md text-title-md font-semibold shadow-md hover:bg-secondary-container transition-all" type="submit">
          <span class="material-symbols-outlined text-[20px] align-middle">save</span> Guardar
        </button>
        <a class="w-full py-2.5 px-space-md rounded-xl bg-surface-container-high text-on-surface font-title-md text-title-md hover:bg-surface-variant transition-colors text-center" href="libros.html">Cancelar</a>
        <button class="hidden text-error font-label-md text-label-md mt-space-sm" id="delete-btn" type="button">
          <span class="material-symbols-outlined text-[16px] align-middle">delete</span> Eliminar libro del catálogo
        </button>
      </div>
    </div>
  </form>
</div>
</main>

<script src="js/auth.js"></script>
<script src="js/empleados.js"></script>
<script src="js/chrome.js"></script>
<script src="js/libros.js"></script>
</body>
</html>
