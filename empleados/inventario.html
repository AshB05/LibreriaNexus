<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Librería Nexus — Inventario y Stock</title>
<link rel="icon" type="image/png" href="../img/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<link href="https://fonts.googleapis.com" rel="preconnect"><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,200..900;1,7..72,200..900&amp;family=Manrope:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="js/tailwind-config.js"></script>
<link href="css/empleados.css" rel="stylesheet">
</head>
<body class="bg-background font-body-md text-on-surface antialiased" data-page="inventario">
<main class="w-full">
<div class="px-space-xl py-space-xl max-w-[1440px] mx-auto w-full flex flex-col gap-space-xl">

  <div class="flex flex-col gap-space-xs max-w-2xl">
    <div class="flex items-center gap-space-xs text-secondary font-label-sm text-label-sm uppercase tracking-wider"><span class="material-symbols-outlined text-[16px]">warehouse</span><span>Gestión de Existencias</span></div>
    <h1 class="font-headline-lg text-headline-lg text-primary tracking-tight">Control de Inventario y Disponibilidad</h1>
    <p class="font-body-md text-body-md text-on-surface-variant">Ajusta existencias físicas. Reglas: stock &gt; 2 Disponible · stock 1–2 Stock bajo · stock 0 Agotado.</p>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-3 gap-space-md">
    <div class="p-space-lg rounded-xl bg-surface-container-lowest shadow-sm flex items-center justify-between">
      <div><span class="font-label-sm text-label-sm uppercase tracking-wider text-outline">Disponible</span><p class="font-display-md text-display-md text-primary" id="inv-disponible">—</p></div>
      <span class="w-3 h-3 rounded-full bg-[#2A523E]"></span>
    </div>
    <div class="p-space-lg rounded-xl bg-surface-container-lowest shadow-sm flex items-center justify-between">
      <div><span class="font-label-sm text-label-sm uppercase tracking-wider text-outline">Stock bajo</span><p class="font-display-md text-display-md text-primary" id="inv-bajo">—</p></div>
      <span class="w-3 h-3 rounded-full bg-[#8E5B10]"></span>
    </div>
    <div class="p-space-lg rounded-xl bg-surface-container-lowest shadow-sm flex items-center justify-between">
      <div><span class="font-label-sm text-label-sm uppercase tracking-wider text-outline">Agotado</span><p class="font-display-md text-display-md text-primary" id="inv-agotado">—</p></div>
      <span class="w-3 h-3 rounded-full bg-outline"></span>
    </div>
  </div>

  <div class="p-space-lg rounded-xl bg-surface-container-lowest shadow-sm">
    <div class="relative">
      <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline text-[20px]">search</span>
      <input id="inv-search" class="w-full h-12 pl-12 pr-4 rounded-xl bg-surface-container-low text-on-surface focus:outline-none focus:bg-surface-container-lowest focus:shadow-md transition-all" placeholder="Buscar por título, autor, ID o ISBN..." type="text">
    </div>
  </div>

  <div class="rounded-xl bg-surface-container-lowest shadow-sm overflow-hidden flex flex-col">
    <div id="inv-list" class="divide-y divide-surface-container"></div>
  </div>
</div>
</main>

<script src="js/auth.js"></script>
<script src="js/empleados.js"></script>
<script src="js/chrome.js"></script>
<script src="js/inventario.js"></script>
</body>
</html>
